<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Compre tênis e sneakers online na SintaxWear. Descubra os últimos lançamentos, promoções exclusivas e encontre o par perfeito para o seu estilo.">
  <title>SintaxWear - Tênis e Sneakers Online</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-category.css">
</head>

<body>

  <header class="header">
    <h1 class="logo">
      <a href="/" title="SintaxWear - Tênis e Sneakers Online">
        <img src="./images/logo/logo.svg" alt="SintaxWear - Tênis e Sneakers Online">
      </a>
    </h1>

    <nav class="nav-center" aria-label="Categorias Principal">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Acesso rápido">
      <ul>
        <li><a href="#">Nossas lojas</a></li>
        <li><a href="#">Sobre</a></li>
        <li>
          <a href="#" aria-label="Minha conta">
            <img src="./images/icons/user.svg" alt="Minha conta" />
          </a>
        </li>
        <li>
          <a href="#" aria-label="Ajuda">
            <img src="./images/icons/help.svg" alt="Ajuda" />
          </a>
        </li>
        <li>
          <a href="#" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Sacola de compras" />
          </a>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo Principal do Site -->
  <main>
    <section class="hero-section">
      <!-- Seção Hero -->
      <div class="hero-overlay">
        <div class="hero-content">
          <span class="hero-subtitle">Krypton One</span>
          <h2 class="hero-title">Transforme qualquer passo em presença.</h2>

          <div class="hero-buttons">
            <a href="#" class="btn btn-outline">Ver modelos</a>
            <a href="#" class="btn btn-filled">Comprar</a>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Seção de Categorias de Tênis -->
    <section class="categories-section">
      <!-- Categorias de tênis -->
      <div class="categories-card casual">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Casual</span>
        </a>
      </div>
      <div class="categories-card esporte">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Esporte</span>
        </a>
      </div>
      <div class="categories-card moderno">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Moderno</span>
        </a>
      </div>
      <div class="categories-card futurista">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Futurista</span>
        </a>
      </div>
    </section>

    <!-- 4. Grid de Produtos em Destaque -->
    <section class="featured-products">
      <!-- Grid com os cartões de produtos -->
    </section>
  </main>

  <!-- 5. Rodapé: Informações de Contato e Links -->
  <footer class="footer">
    <!-- Informações de contato e links de rodapé -->
  </footer>
</body>

</html>
